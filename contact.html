<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Billan Software Solutions</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            background: linear-gradient(135deg, #0a192f, #1a2f3f);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .form-header::before {
            content: '📧';
            position: absolute;
            bottom: -30px;
            right: -30px;
            font-size: 8rem;
            opacity: 0.1;
            transform: rotate(15deg);
        }

        .form-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
        }

        .form-header h1 span {
            color: #4CAF50;
        }

        .form-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
        }

        .form-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group label i {
            color: #4CAF50;
            margin-right: 8px;
            width: 20px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-group input:hover,
        .form-group textarea:hover {
            border-color: #999;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        .checkbox-group label {
            color: #666;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-group label a {
            color: #4CAF50;
            text-decoration: none;
        }

        .checkbox-group label a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0a192f, #1a2f3f);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }

        .btn-submit i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .btn-submit:hover i {
            transform: translateX(5px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .form-footer p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .required-field::after {
            content: '*';
            color: #ff4444;
            margin-left: 4px;
        }

        .honeypot {
            display: none;
        }

        /* Success animation */
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .success-animation {
            animation: successPulse 0.5s ease-in-out;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-header h1 {
                font-size: 2rem;
            }
            
            .form-body {
                padding: 20px;
            }
            
            .form-group input,
            .form-group textarea {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Contact <span>Billan</span></h1>
                <p><i class="fas fa-leaf"></i> From roots to leaves, we're here to help <i class="fas fa-tree"></i></p>
            </div>
            
            <div class="form-body">
                <!-- Status message for user feedback -->
                <div id="statusMessage" class="status-message"></div>
                
                <!-- YOUR FORMSPREE FORM - USING YOUR ENDPOINT -->
                <form id="contactForm" action="https://formspree.io/f/xreaoybw" method="POST">
                    
                    <!-- Name field (optional but recommended) -->
                    <div class="form-group">
                        <label for="name">
                            <i class="fas fa-user"></i> Your Name <span class="required-field"></span>
                        </label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    
                    <!-- Your email field (required) -->
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> Your Email <span class="required-field"></span>
                        </label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    
                    <!-- Your message field (required) -->
                    <div class="form-group">
                        <label for="message">
                            <i class="fas fa-comment"></i> Your Message <span class="required-field"></span>
                        </label>
                        <textarea id="message" name="message" placeholder="Tell us about your project..." required></textarea>
                    </div>
                    
                    <!-- Optional: Subject field -->
                    <div class="form-group">
                        <label for="subject">
                            <i class="fas fa-tag"></i> Subject
                        </label>
                        <input type="text" id="subject" name="_subject" placeholder="What's this about?">
                    </div>
                    
                    <!-- Optional: Reply to email -->
                    <input type="hidden" name="_replyto" value="email">
                    
                    <!-- Optional: Format email -->
                    <input type="hidden" name="_template" value="table">
                    
                    <!-- Honeypot field to prevent spam (hidden from real users) -->
                    <div class="honeypot">
                        <label>Don't fill this out if you're human: 
                            <input type="text" name="_gotcha">
                        </label>
                    </div>
                    
                    <!-- Consent checkbox -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="consent" name="consent" required>
                        <label for="consent">
                            I agree to the <a href="#">privacy policy</a> and consent to being contacted
                        </label>
                    </div>
                    
                    <!-- Submit button -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                
                <div class="form-footer">
                    <p><i class="fas fa-tree" style="color: #4CAF50;"></i> We'll respond within 24 hours <i class="fas fa-leaf" style="color: #4CAF50;"></i></p>
                    <p style="margin-top: 10px;">
                        <small>Built with <i class="fas fa-heart" style="color: #ff4444;"></i> by <a href="#">Mugisha Billy-Chriss</a> & <a href="#">Manzi Allan</a></small>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for form handling -->
    <script>
        const contactForm = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        if (contactForm) {
            contactForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Show loading state
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Sending...</span> <i class="fas fa-spinner fa-spin"></i>';
                
                // Get form data
                const formData = new FormData(contactForm);
                
                try {
                    const response = await fetch(contactForm.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Success message
                        statusMessage.className = 'status-message success';
                        statusMessage.innerHTML = '<i class="fas fa-check-circle"></i> Thank you! Your message has been sent successfully. We\'ll get back to you soon! 🌱';
                        
                        // Add success animation to form
                        document.querySelector('.form-card').classList.add('success-animation');
                        setTimeout(() => {
                            document.querySelector('.form-card').classList.remove('success-animation');
                        }, 500);
                        
                        // Reset form
                        contactForm.reset();
                        
                        // Reset button after 2 seconds
                        setTimeout(() => {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<span>Send Message</span> <i class="fas fa-paper-plane"></i>';
                        }, 2000);
                        
                        // Hide success message after 5 seconds
                        setTimeout(() => {
                            statusMessage.style.display = 'none';
                        }, 5000);
                    } else {
                        // Error message
                        throw new Error(data.error || 'Form submission failed');
                    }
                } catch (error) {
                    // Error message
                    statusMessage.className = 'status-message error';
                    statusMessage.innerHTML = '<i class="fas fa-exclamation-circle"></i> Oops! Something went wrong. Please try again or email us directly.';
                    
                    // Reset button
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Send Message</span> <i class="fas fa-paper-plane"></i>';
                    
                    // Hide error after 5 seconds
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, 5000);
                }
            });
        }

        // Real-time validation feedback
        const inputs = document.querySelectorAll('input[required], textarea[required]');
        inputs.forEach(input => {
            input.addEventListener('invalid', (e) => {
                e.preventDefault();
                input.style.borderColor = '#ff4444';
            });
            
            input.addEventListener('input', () => {
                input.style.borderColor = '#e0e0e0';
                if (input.checkValidity()) {
                    input.style.borderColor = '#4CAF50';
                }
            });
        });

        // Character counter for message
        const messageField = document.getElementById('message');
        if (messageField) {
            const counter = document.createElement('small');
            counter.style.cssText = 'display: block; text-align: right; margin-top: 5px; color: #666;';
            counter.textContent = '0 characters';
            messageField.parentNode.appendChild(counter);
            
            messageField.addEventListener('input', () => {
                const count = messageField.value.length;
                counter.textContent = `${count} characters`;
                if (count > 500) {
                    counter.style.color = '#ff4444';
                } else {
                    counter.style.color = '#666';
                }
            });
        }

        // Prevent double submission
        let submitting = false;
        contactForm.addEventListener('submit', () => {
            if (submitting) {
                e.preventDefault();
            }
            submitting = true;
            setTimeout(() => {
                submitting = false;
            }, 3000);
        });
    </script>
</body>
</html>
